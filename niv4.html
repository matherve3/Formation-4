<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MON DRÔLE PARCOURS CYBER — Niveau 4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b14;--card:#111a2e;--card2:#0f1729;--line:#1e2a44;--txt:#e8eef7;--txt2:#94a3b8;--cyan:#00d4ff;--green:#22c55e;--gold:#fbbf24;--red:#ef4444;--purple:#a78bfa;--purple2:#c4b5fd;--pink:#ec4899}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#070b14;color:var(--txt);line-height:1.7;font-size:15px;min-height:100vh}
h2{font-size:1.4rem;color:var(--txt);margin-bottom:12px}
h3{font-size:1.1rem;color:var(--purple2);margin:18px 0 8px}
h4{font-size:.98rem;color:#f0abfc;margin:12px 0 6px}
p{margin:10px 0;color:#cbd5e1}
ul,ol{padding-left:22px;margin:10px 0}
li{margin-bottom:6px;color:#cbd5e1}
strong{color:var(--gold)}
em{color:var(--purple2);font-style:normal;font-weight:600}
code{background:#0a1220;padding:2px 6px;border-radius:4px;color:var(--cyan);font-size:.88em;font-family:monospace;border:1px solid var(--line)}
pre{background:#050914;padding:12px;border-radius:6px;overflow-x:auto;font-size:.82em;margin:10px 0;color:#c4b5fd;border:1px solid var(--line);white-space:pre}
a{color:var(--cyan);text-decoration:none}
button{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;border:none;padding:11px 20px;border-radius:9px;font-weight:700;cursor:pointer;font-size:.9rem;font-family:inherit;transition:transform .1s}
button:hover{transform:translateY(-1px)}
button.sec{background:#1a2540;color:var(--txt);border:1px solid #2a3a5c}
button.green{background:linear-gradient(135deg,var(--green),#16a34a);color:#052e16}
button.gold{background:linear-gradient(135deg,var(--gold),#d97706);color:#1a1200}
button.print{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff}
header{background:rgba(13,20,36,.92);backdrop-filter:blur(12px);padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:800;font-size:.95rem}
.logo .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--purple),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:1rem}
.logo .name span{color:var(--purple2)}
.hs{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--txt2);flex-wrap:wrap}
.hs .pill{background:#0f1729;padding:5px 10px;border-radius:16px;border:1px solid var(--line);font-weight:600}
.hs .pill b{color:var(--purple2)}
.hs .logout{cursor:pointer;color:var(--red);font-weight:700;padding:5px 10px}
main{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border-radius:14px;padding:22px;margin-bottom:16px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.crumb{font-size:.82rem;color:#64748b;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--cyan);cursor:pointer}
.intro{background:#1e1b4b;padding:16px;border-radius:10px;margin:14px 0;border-left:4px solid var(--purple);font-style:italic;color:#ddd6fe}
.analogy{background:#312e81;padding:14px;border-radius:10px;margin:14px 0;border-left:4px solid #818cf8;color:#c7d2fe}
.bank{background:#0d3a1f;padding:14px;border-radius:8px;margin:14px 0;border-left:4px solid var(--green);color:#b5e8c8}
.pr{background:#0a3a1a;padding:14px;border-radius:10px;margin:14px 0;border-left:4px solid #16a34a;color:#a7f3c4}
.er{background:#3a0f0f;padding:14px;border-radius:8px;margin:14px 0;border-left:4px solid var(--red);color:#f4c4c4}
.df{background:#3a2a0a;padding:14px;border-radius:8px;margin:14px 0;border-left:4px solid var(--gold);color:#f5e3a8}
table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.88em}
th{background:#0f1729;color:var(--purple2);padding:8px;text-align:left;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:8px;color:#cbd5e1}
.quiz{background:#0a1220;padding:16px;border-radius:10px;margin-top:14px;border:1px solid var(--line)}
.q{margin-bottom:16px;padding:12px;background:var(--card2);border-radius:8px;border:1px solid var(--line)}
.q>p:first-child{font-weight:600;margin-bottom:10px;color:var(--txt)}
.q label{display:block;padding:10px 12px;margin:5px 0;background:#111827;border-radius:7px;cursor:pointer;border:1.5px solid transparent;color:#cbd5e1;font-size:.9rem}
.q label:hover{background:#1a2540}
.q input{margin-right:10px;accent-color:var(--purple)}
.ok{background:rgba(34,197,94,.15)!important;border-color:var(--green)!important;color:#a7f3c4!important}
.ko{background:rgba(239,68,68,.15)!important;border-color:var(--red)!important;color:#fca5a5!important}
.exp{background:#050914;padding:10px;border-radius:6px;margin-top:8px;font-size:.85em;color:#cbd5e1;border-left:3px solid var(--gold);display:none}
.res{margin-top:14px;padding:14px;border-radius:8px;font-weight:700;text-align:center}
.res.g{background:rgba(34,197,94,.15);color:#a7f3c4;border:1px solid var(--green)}
.res.r{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid var(--red)}
.nav{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.btn{background:var(--card2);padding:14px;border-radius:10px;cursor:pointer;border:2px solid transparent;text-align:left;transition:all .15s}
.btn:hover{border-color:var(--purple);transform:translateY(-2px)}
.btn.done{border-color:var(--green);background:#0d3a1f}
.btn .n{font-weight:800;color:var(--purple2);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.5px}
.btn.done .n{color:var(--green)}
.btn .ti{display:block;font-size:.88rem;color:var(--txt);margin-top:5px;font-weight:600;line-height:1.4}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.stat{background:#111a2e;padding:18px;border-radius:12px;border:1px solid var(--line);text-align:center;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--pink))}
.stat .big{font-size:2em;font-weight:800;color:var(--purple2);display:block;line-height:1.1}
.stat .lbl{font-size:.75em;color:var(--txt2);margin-top:6px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.progress-bar{background:#0a1220;height:8px;border-radius:4px;overflow:hidden;margin:12px 0;border:1px solid var(--line)}
.progress-bar>div{height:100%;background:linear-gradient(90deg,var(--purple),var(--pink));transition:width .5s}
.login-box{max-width:400px;margin:50px auto;background:var(--card);padding:30px;border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.login-box h2{text-align:center;margin-bottom:8px;font-size:1.5rem}
.login-box .sub{text-align:center;color:var(--txt2);font-size:.85rem;margin-bottom:22px}
.login-box input{width:100%;padding:12px 14px;margin:8px 0;background:#0a1220;border:1.5px solid var(--line);border-radius:9px;color:var(--txt);font-size:.95rem;font-family:inherit}
.login-box input:focus{outline:none;border-color:var(--purple)}
.login-box button{width:100%;margin-top:12px;padding:13px}
.cert-locked{text-align:center;padding:40px 20px;background:#0d1424;border-radius:14px;border:2px dashed #2a3a5c}
.cert-locked .icon{font-size:3.5em;margin-bottom:14px;opacity:.6}
.cert-locked h3{color:var(--gold);font-size:1.2rem;margin:0 0 8px}
.cert-locked p{color:var(--txt2);max-width:400px;margin:8px auto;font-size:.9rem}
.cert-locked .progress-small{width:180px;height:6px;background:#0a1220;border-radius:3px;margin:14px auto;overflow:hidden;border:1px solid var(--line)}
.cert-locked .progress-small>div{height:100%;background:linear-gradient(90deg,var(--gold),#d97706)}
.certificate{background:linear-gradient(135deg,#1e1b4b,#312e81,#1e1b4b);padding:36px 26px;border-radius:14px;border:3px double var(--purple);position:relative;text-align:center;box-shadow:0 20px 60px rgba(167,139,250,.15);color:var(--txt)}
.certificate .seal{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#7c3aed);display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 16px;border:3px solid #ddd6fe}
.certificate .subtitle{color:var(--purple2);font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;margin-bottom:6px}
.certificate .title{font-family:Georgia,serif;font-size:1.4rem;font-weight:700;color:#ddd6fe;margin:6px 0 16px}
.certificate .certifies{color:#94a3b8;font-size:.85rem;margin:12px 0 6px;font-style:italic}
.certificate .name{font-family:Georgia,serif;font-size:1.8rem;font-weight:700;color:#fff;padding:14px 0;border-bottom:2px solid var(--purple);border-top:2px solid var(--purple);margin:10px auto 18px;max-width:360px}
.certificate .level-title{font-size:1.05rem;font-weight:700;color:var(--purple2);margin:14px 0 6px}
.certificate .details{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin:20px 0 16px;font-size:.82rem;color:#94a3b8}
.certificate .details div{text-align:center}
.certificate .details strong{color:var(--cyan);display:block;font-size:.95rem;margin-top:3px}
.certificate .cert-id{font-family:monospace;font-size:.7rem;color:#64748b;padding:8px;background:rgba(0,0,0,.3);border-radius:5px;display:inline-block;margin-top:12px}
.certificate .signature{margin-top:24px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.certificate .signature-block{text-align:center;flex:1;min-width:140px}
.certificate .sig-line{border-top:1px solid #94a3b8;padding-top:6px;font-size:.75rem;color:#94a3b8;margin-top:24px}
.certificate .sig-name{font-family:Georgia,serif;font-style:italic;color:var(--purple2);font-size:1rem}
.cv-container{background:#fff;color:#1a1a1a;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.cv-page{padding:36px 40px;font-family:'Inter',sans-serif;line-height:1.55;max-width:820px;margin:0 auto}
.cv-header{border-bottom:3px solid #4c1d95;padding-bottom:18px;margin-bottom:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
.cv-header h1{font-size:1.9rem;font-weight:800;color:#4c1d95;line-height:1.1;margin-bottom:4px}
.cv-header .role{color:#7c3aed;font-size:1rem;font-weight:600;margin-bottom:6px}
.cv-header .objective{color:#475569;font-size:.85rem;max-width:400px;font-style:italic}
.cv-header .right{text-align:right;font-size:.82rem;color:#334155;line-height:1.7}
.cv-section{margin-bottom:22px}
.cv-section h2{font-size:.9rem;font-weight:800;color:#4c1d95;text-transform:uppercase;letter-spacing:1.2px;border-bottom:1.5px solid #cbd5e1;padding-bottom:6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.cv-section h2::before{content:'';width:4px;height:14px;background:#4c1d95;border-radius:2px}
.cv-item{margin-bottom:12px}
.cv-item .line1{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:3px}
.cv-item .title{font-weight:700;color:#0f172a;font-size:.94rem}
.cv-item .date{font-size:.78rem;color:#64748b;font-weight:600}
.cv-item .org{color:#7c3aed;font-size:.85rem;font-weight:600;margin-bottom:3px}
.cv-item .desc{font-size:.85rem;color:#475569}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.skill{font-size:.85rem;margin-bottom:6px}
.skill .name{display:flex;justify-content:space-between;font-weight:600;color:#1e293b;margin-bottom:3px}
.skill .bar{height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.skill .bar>div{height:100%;background:linear-gradient(90deg,#4c1d95,#7c3aed)}
.cv-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cv-badge{padding:3px 9px;background:#ede9fe;color:#4c1d95;border-radius:10px;font-size:.75rem;font-weight:700;border:1px solid #ddd6fe}
.cv-badge.gold{background:#fef3c7;color:#92400e;border-color:#fde68a}
.cv-badge.green{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.cv-footer{margin-top:24px;padding-top:12px;border-top:1px solid #e2e8f0;font-size:.68rem;color:#94a3b8;text-align:center}
.tabs{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
.tab{padding:8px 16px;background:var(--card2);border-radius:8px;cursor:pointer;font-size:.82em;font-weight:600;color:var(--txt2);border:1.5px solid transparent}
.tab.active{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff;font-weight:700}
.certs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.cert-item{background:var(--card2);padding:16px;border-radius:10px;border-left:4px solid var(--purple);display:flex;flex-direction:column}
.cert-item.free{border-left-color:var(--green)}
.cert-item.paid{border-left-color:var(--gold)}
.cert-item h4{margin:0 0 5px;font-size:.92em;color:var(--txt);line-height:1.3}
.cert-item .org{font-size:.72em;color:var(--txt2);margin-bottom:8px}
.cert-item .tag{display:inline-block;padding:2px 8px;border-radius:16px;font-size:.66em;font-weight:700;margin-right:3px;margin-bottom:3px}
.cert-item .tag.free{background:rgba(34,197,94,.15);color:#86efac}
.cert-item .tag.paid{background:rgba(251,191,36,.15);color:#fde68a}
.cert-item .tag.lvl{background:rgba(59,130,246,.15);color:#93c5fd}
.cert-item .tag.req{background:rgba(168,85,247,.15);color:#d8b4fe}
.cert-item p{font-size:.8em;color:#cbd5e1;margin:6px 0;flex:1;line-height:1.5}
.cert-item .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.cert-item .actions a{flex:1;text-align:center;padding:7px 10px;background:#1a2540;color:var(--cyan);border-radius:6px;font-size:.76em;font-weight:700;text-decoration:none;border:1px solid #2a3a5c}
.cert-item .actions button{padding:7px 10px;font-size:.76em;background:#1a2540;color:var(--txt);border:1px solid #2a3a5c}
.cert-item.done{background:#0d3a1f;border-left-color:var(--green)}
.cert-item.done .actions button{background:var(--green);color:#052e16}
.jobs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:14px}
.job-item{background:var(--card2);padding:16px;border-radius:10px;border-left:4px solid var(--green)}
.job-item h4{margin:0 0 5px;color:#86efac;font-size:.92em}
.job-item .job-org{font-size:.75em;color:var(--txt2);margin-bottom:6px}
.job-item .job-desc{font-size:.8em;color:#cbd5e1;margin:6px 0;line-height:1.5}
.job-item .job-link{display:inline-block;padding:5px 12px;background:#1a2540;color:var(--cyan);border-radius:6px;font-size:.76em;font-weight:700;text-decoration:none;margin-top:6px;border:1px solid #2a3a5c}
.exam-card{background:linear-gradient(135deg,#1e1b4b,#0d1424);padding:18px;border-radius:12px;margin:12px 0;border-left:4px solid var(--purple)}
.exam-card h4{color:#ddd6fe;margin:0 0 6px;font-size:1rem}
.exam-card.locked{opacity:.55;border-left-color:#475569}
.exam-card.passed{background:linear-gradient(135deg,#052e16,#031a0d);border-left-color:var(--green)}
.exam-card.passed h4{color:#86efac}
.sync-box{background:#0a1220;padding:16px;border-radius:10px;margin:12px 0;border:1px solid var(--line)}
.sync-box textarea{width:100%;min-height:100px;background:#050914;color:var(--cyan);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:monospace;font-size:.7em;resize:vertical;word-break:break-all}
.sync-box label{display:block;margin:8px 0 5px;color:var(--txt2);font-size:.82em;font-weight:600}
.sync-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.today-list{list-style:none;padding:0;margin:10px 0}
.today-list li{padding:10px 12px;background:var(--card2);border-radius:6px;margin-bottom:6px;border-left:3px solid var(--green);font-size:.87em;color:#cbd5e1}
footer{text-align:center;padding:24px 20px;color:#64748b;font-size:.8em;font-weight:600;border-top:1px solid var(--line);margin-top:32px}
#ver{position:fixed;bottom:8px;right:8px;background:#0d1424;color:#a78bfa;font-family:monospace;font-size:.68em;padding:4px 8px;border-radius:4px;border:1px solid var(--line);opacity:.85;z-index:999}
#err{position:fixed;bottom:8px;left:8px;background:#3a0f0f;color:#fca5a5;font-family:monospace;font-size:.68em;padding:4px 8px;border-radius:4px;border:1px solid var(--red);display:none;max-width:80%;z-index:999}
@media print{header,footer,.nav,#ver,#err,.tabs,button{display:none!important}.card{box-shadow:none!important}}
</style>
</head>

<header>

    <div class="mark">🔐</div>

  </div>
  <div class="hs" id="hs"></div>
</header>
<main id="app"></main>
<footer>© H. N'GUESSAN ® — Niveau 4 · Cryptographie</footer>

<div id="err"></div>

<script>
window.addEventListener('error', function(e) {
  var el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = 'ERREUR: ' + e.message; }
});

var KEY = 'mdpc_v40';
var state = { currentUser: null, users: {} };
try {
  var raw = localStorage.getItem(KEY);
  if (raw) state = JSON.parse(raw);
} catch (e) { console.warn('load', e); }

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} updateHeader(); }
function user() { return state.currentUser ? state.users[state.currentUser] : null; }
function makeUser(name) { return { name: name, defisDone: {}, certsDone: [], examens: {}, jours: {}, createdAt: new Date().toISOString().slice(0,10) }; }
function today() { return new Date().toISOString().slice(0,10); }

function countDone(lvl) {
  var u = user(); if (!u) return 0;
  var c = 0, p = lvl + '_';
  for (var k in u.defisDone) { if (k.indexOf(p) === 0 && u.defisDone[k]) c++; }
  return c;
}
function isComplete(lvl) { return countDone(lvl) >= 10; }
function isUnlocked(lvl) { if (lvl === 1) return true; return isComplete(lvl - 1); }

function simulate() {
  var u = user(); if (!u) return;
  for (var i = 1; i <= 10; i++) { u.defisDone['1_'+i]=true; u.defisDone['2_'+i]=true; u.defisDone['3_'+i]=true; }
  save();
  alert('Niveaux 1, 2 et 3 simulés terminés. Niveau 4 débloqué !');
  route();
}

function login() {
  var el = document.getElementById('loginName'); if (!el) return;
  var n = el.value.trim(); if (!n) { alert('Entre ton prénom'); return; }
  var k = n.toLowerCase().replace(/\s+/g, '_');
  if (!state.users[k]) state.users[k] = makeUser(n);
  state.currentUser = k;
  save(); go('home');
}
function logout() { state.currentUser = null; save(); go('login'); }
function go(h) { location.hash = h; }

var DEFIS = [
{
id:1,
titre:"Introduction à la cryptographie",
intro:"La cryptographie est la science de protéger les informations. C'est la base de toute communication sécurisée, du HTTPS aux paiements bancaires.",
cours:`<h3>🔐 Qu'est-ce que la cryptographie ?</h3><p>La <strong>cryptographie</strong> est la science qui permet de <em>protéger le secret des messages</em>. Elle est utilisée partout : HTTPS, WhatsApp, cartes bancaires, mots de passe, signature électronique.</p><h4>📜 Un peu d'histoire</h4><ul><li><strong>Chiffre de César</strong> (50 av. JC) — décalage de 3 lettres. Casser : 25 essais.</li><li><strong>Chiffre de Vigenère</strong> (XVIe) — plusieurs alphabets, inviolable pendant 300 ans.</li><li><strong>Enigma</strong> (XXe) — utilisée par les nazis, cassée par Turing en 1940.</li><li><strong>DES/AES</strong> (1970-2000) — standards modernes.</li><li><strong>Cryptographie post-quantique</strong> (2024+) — pour résister aux ordinateurs quantiques.</li></ul><h4>🎯 Les 3 objectifs (CIA)</h4><ul><li><strong>Confidentialité</strong> — seul le destinataire peut lire.</li><li><strong>Intégrité</strong> — le message n'a pas été modifié.</li><li><strong>Authenticité</strong> — l'expéditeur est bien celui annoncé.</li></ul><h4>🧩 Les 3 familles</h4><ul><li><strong>Symétrique</strong> — une seule clé partagée (AES). Rapide.</li><li><strong>Asymétrique</strong> — deux clés, publique et privée (RSA, ECC). Lent.</li><li><strong>Hachage</strong> — empreinte irréversible (SHA-256). Pour intégrité.</li></ul><h4>📚 Vocabulaire</h4><table><tr><th>Terme</th><th>Définition</th></tr><tr><td>Clair (plaintext)</td><td>Message lisible</td></tr><tr><td>Chiffré (ciphertext)</td><td>Message protégé</td></tr><tr><td>Clé (key)</td><td>Valeur secrète contrôlant le chiffrement</td></tr><tr><td>Chiffrement</td><td>Transformer clair → chiffré</td></tr><tr><td>Déchiffrement</td><td>Transformer chiffré → clair</td></tr><tr><td>Cryptanalyse</td><td>Art de casser le chiffrement</td></tr></table><div class="analogy">🧠 <strong>Analogie</strong> : la cryptographie est un coffre-fort. Le contenu = clair, la serrure + combinaison = clé, le coffre fermé = chiffré. Seul celui qui connaît la combinaison peut ouvrir.</div><div class="bank">🏦 <strong>Banque</strong> : chaque paiement par carte, chaque connexion au site bancaire, chaque virement SWIFT utilise de la cryptographie. Sans elle, aucun système bancaire moderne ne pourrait exister.</div><div class="df">⚠️ <strong>Erreur classique</strong> : croire que « cacher l'algorithme » protège. Le principe de Kerckhoffs dit : la sécurité doit reposer UNIQUEMENT sur le secret de la clé, pas sur celui de l'algorithme.</div>`,
cas:`<h3>🔧 Cas 1 — Chiffre de César</h3><p><strong>Situation :</strong> déchiffrer « ORGQH » avec un décalage de 3.</p><h4>Méthode</h4><p>On recule de 3 lettres dans l'alphabet : O→L, R→O, G→D, Q→N, H→E → <strong>LODNE</strong>... (en vrai, TESTE avec un autre décalage).</p><h4>Pourquoi c'est cassable</h4><p>Il n'y a que 25 décalages possibles. Un ordinateur essaie les 25 en une fraction de seconde.</p><h3>🔧 Cas 2 — Reconnaître un chiffrement</h3><p><strong>Situation :</strong> vous recevez une chaîne « U2FsdGVkX1+... ».</p><h4>Analyse</h4><ul><li>Commence par <code>U2FsdGVkX1</code> → c'est du base64 qui décode en <code>Salted__</code> → signature d'un chiffrement <strong>OpenSSL</strong> (AES).</li><li>Un hash SHA-256 fait 64 caractères hexadécimaux (0-9 a-f).</li><li>Un hash MD5 fait 32 caractères.</li><li>Un certificat X.509 commence par <code>-----BEGIN CERTIFICATE-----</code>.</li></ul><h3>🔧 Cas 3 — HTTPS dans le navigateur</h3><p><strong>Situation :</strong> vérifier qu'un site bancaire utilise de la cryptographie correcte.</p><ol><li>Cliquer sur le cadenas dans la barre d'adresse.</li><li>Vérifier : certificat valide, émis par une AC de confiance (DigiCert, Let's Encrypt).</li><li>Vérifier : TLS 1.2 minimum, idéalement 1.3.</li><li>Vérifier : algorithme AES-256-GCM ou ChaCha20.</li></ol>`,
quiz:[
{q:'Que signifie CIA en cryptographie ?',o:['Central Intelligence Agency','Confidentialité, Intégrité, Authenticité','Chiffrement, Intégrité, Anonymat','Confiance, Identité, Autorisation'],c:1,e:'Confidentialité, Intégrité, Authenticité — les 3 objectifs fondamentaux.'},
{q:'Le principe de Kerckhoffs dit que ?',o:['L algorithme doit être secret','La clé doit être secrète, pas l algorithme','Il faut cacher l existence du message','Le plus simple est le meilleur'],c:1,e:'La sécurité repose uniquement sur le secret de la clé.'},
{q:'Quelle famille de cryptographie utilise UNE seule clé ?',o:['Symétrique','Asymétrique','Hachage','Quantique'],c:0,e:'Symétrique = une seule clé partagée (ex : AES).'}

{
id:2,
titre:"Chiffrement symétrique — AES et compagnie",
intro:"Le chiffrement symétrique utilise une seule clé partagée entre émetteur et destinataire. C'est le plus rapide et le plus utilisé pour les données en masse.",
cours:`<h3>🔑 Principe du chiffrement symétrique</h3><p>Une <strong>seule clé</strong> sert à chiffrer ET déchiffrer. Émetteur et destinataire doivent la partager au préalable. C'est le mode le plus ancien et le plus rapide.</p><h4>📊 Les algorithmes</h4><table><tr><th>Algorithme</th><th>Taille clé</th><th>Statut</th></tr><tr><td>DES</td><td>56 bits</td><td>❌ Cassé (1998)</td></tr><tr><td>3DES</td><td>168 bits</td><td>⚠️ Obsolète (2023)</td></tr><tr><td>AES-128</td><td>128 bits</td><td>✅ Standard</td></tr><tr><td>AES-256</td><td>256 bits</td><td>✅✅ Recommandé</td></tr><tr><td>ChaCha20</td><td>256 bits</td><td>✅ Rapide (mobiles)</td></tr></table><h4>🎛 Les modes opératoires d'AES</h4><ul><li><strong>ECB</strong> — dangereux ! Chaque bloc identique donne le même chiffré → fuite d'information (cf. image du pingouin).</li><li><strong>CBC</strong> — chaîne les blocs avec un IV. Bien mais sensible au padding oracle.</li><li><strong>CTR</strong> — transforme AES en chiffrement de flux. Rapide mais pas d'authentification.</li><li><strong>GCM</strong> — ✅ recommandé. Chiffre ET authentifie (AEAD). Utilisé par TLS 1.3.</li></ul><h4>📏 Tailles et sécurité</h4><p>Une clé AES-128 est considérée sûre jusqu'à ~2050. AES-256 résiste aux ordinateurs quantiques (via Grover, seulement √n, donc 2^128 au lieu de 2^256 — toujours infaisable).</p><div class="analogy">🧠 <strong>Analogie</strong> : le chiffrement symétrique c'est comme un cadenas à clé unique. La même clé ouvre et ferme. Problème : comment donner la clé au destinataire sans qu'un attaquant l'intercepte ? C'est le problème de la distribution des clés.</div><div class="bank">🏦 <strong>Banque</strong> : les bases de données bancaires chiffrent les données clients avec AES-256-GCM. Les HSM (Hardware Security Module) stockent les clés hors de portée des serveurs applicatifs.</div><div class="df">⚠️ <strong>Piège</strong> : ne JAMAIS utiliser ECB. Un fichier BMP chiffré en ECB montre encore les contours de l'image. Un fichier de paie chiffré en ECB laisse voir les patterns répétitifs.</div>`,
cas:`<h3>🔧 Cas 1 — Chiffrer un fichier avec AES (ligne de commande)</h3><p><strong>Situation :</strong> chiffrer un fichier sensible avec OpenSSL.</p><pre>openssl enc -aes-256-cbc -pbkdf2 -in data.txt -out data.enc</pre><p>Résultat : fichier chiffré, demande un mot de passe.</p><p>Pour déchiffrer :</p><pre>openssl enc -d -aes-256-cbc -pbkdf2 -in data.enc -out data.txt</pre><h4>Recommandation</h4><p>En 2024, préférer AES-256-GCM si possible, ou ChaCha20-Poly1305 sur mobiles.</p><h3>🔧 Cas 2 — Voir une image chiffrée en ECB</h3><p><strong>Situation :</strong> comprendre pourquoi ECB est mauvais.</p><ol><li>Prendre une image .BMP (pas compressée).</li><li>Chiffrer avec AES-128-ECB.</li><li>Ouvrir l'image chiffrée.</li><li>Observation : on voit encore les contours de l'image d'origine !</li></ol><p>Cause : ECB chiffre chaque bloc de 16 octets indépendamment. Deux blocs identiques donnent le même chiffré → l'attaquant distingue les zones uniformes.</p><div class="er">❌ Ne jamais utiliser ECB pour des données sensibles.</div><h3>🔧 Cas 3 — Chiffrer une base de données</h3><p><strong>Situation :</strong> un site bancaire doit chiffrer les numéros de carte en base.</p><ol><li>Utiliser AES-256-GCM côté application.</li><li>Stocker la clé dans un HSM (pas en base !).</li><li>Chiffrer chaque champ séparément avec un IV aléatoire.</li><li>Déchiffrer uniquement à l'affichage.</li><li>Auditer les accès au HSM.</li></ol>`,
quiz:[
{q:'Quel algorithme symétrique est le standard actuel ?',o:['DES','3DES','AES','MD5'],c:2,e:'AES est le standard depuis 2001.'},
{q:'Quel mode AES est recommandé pour TLS ?',o:['ECB','CBC sans IV','GCM','Rien, préférer DES'],c:2,e:'GCM chiffre ET authentifie (AEAD). Recommandé par TLS 1.3.'},
{q:'Pourquoi ECB est dangereux ?',o:['Trop lent','Les blocs identiques donnent des chiffrés identiques','Pas standard','Ne fonctionne pas sur AES'],c:1,e:'ECB ne cache pas les patterns → fuite d information visuelle.'}
]},

{
id:3,
titre:"Chiffrement asymétrique — RSA et ECC",
intro:"Le chiffrement asymétrique utilise deux clés : une publique pour chiffrer, une privée pour déchiffrer. C'est la révolution qui a permis Internet sécurisé.",
cours:`<h3>🔐 Deux clés au lieu d'une</h3><p>Chaque utilisateur possède :</p><ul><li>Une <strong>clé publique</strong> — partagée avec tout le monde, pour chiffrer ou vérifier.</li><li>Une <strong>clé privée</strong> — gardée secrète, pour déchiffrer ou signer.</li></ul><p>Ce qui est chiffré avec la publique ne peut être déchiffré qu'avec la privée (et inversement pour la signature).</p><h4>📊 Les algorithmes</h4><table><tr><th>Algorithme</th><th>Base mathématique</th><th>Taille clé</th></tr><tr><td>RSA</td><td>Factorisation de grands nombres</td><td>2048-4096 bits</td></tr><tr><td>ECC</td><td>Logarithme discret sur courbes</td><td>256-521 bits</td></tr><tr><td>Diffie-Hellman</td><td>Logarithme discret</td><td>2048+ bits (échange)</td></tr><tr><td>Ed25519</td><td>Courbe d'Edwards</td><td>256 bits (signature)</td></tr></table><h4>🔄 Diffie-Hellman — échange de clés</h4><p>Permet à deux parties de créer une clé partagée SANS jamais la transmettre sur le réseau. C'est la base de tous les échanges HTTPS.</p><p>Alice et Bob choisissent chacun un nombre secret. Ils échangent des valeurs publiques. En combinant, ils obtiennent le même secret partagé. Un espion qui voit tout l'échange ne peut PAS retrouver le secret (problème du logarithme discret).</p><h4>⚖️ Symétrique vs Asymétrique</h4><table><tr><th>Critère</th><th>Symétrique (AES)</th><th>Asymétrique (RSA)</th></tr><tr><td>Vitesse</td><td>Très rapide (Go/s)</td><td>Lent (Ko/s)</td></tr><tr><td>Clé à partager</td><td>Oui (problème)</td><td>Non (clé publique)</td></tr><tr><td>Usage</td><td>Données en masse</td><td>Échange de clés, signatures</td></tr></table><div class="analogy">🧠 <strong>Analogie</strong> : la clé publique est comme une boîte aux lettres avec une fente. Tout le monde peut y déposer un message, seul le propriétaire avec sa clé peut ouvrir la boîte. Pour la signature, c'est l'inverse : seul le propriétaire peut signer, tout le monde peut vérifier.</div><div class="bank">🏦 <strong>Banque</strong> : RSA-2048 est utilisé dans les cartes bancaires (EMV) pour la signature des transactions. Les certificats des sites bancaires utilisent RSA ou ECC.</div><div class="df">⚠️ <strong>Piège</strong> : RSA-1024 est cassé (depuis 2010). RSA-2048 tiendra encore ~10 ans, mais la migration vers ECC est recommandée (plus rapide, plus sûr, clés plus courtes).</div>`,
cas:`<h3>🔧 Cas 1 — Générer une paire de clés RSA</h3><p><strong>Situation :</strong> créer une clé RSA 4096 pour un serveur.</p><pre>openssl genrsa -out server.key 4096\nopenssl rsa -in server.key -pubout -out server.pub</pre><p>Résultat : <code>server.key</code> (privée, à protéger en 600), <code>server.pub</code> (publique, à distribuer).</p><h3>🔧 Cas 2 — Échange Diffie-Hellman en pratique</h3><p><strong>Situation :</strong> comprendre le handshake TLS.</p><ol><li>Le client envoie « ClientHello » avec ses algorithmes.</li><li>Le serveur répond « ServerHello » avec son choix et sa clé publique DH.</li><li>Le client envoie sa clé publique DH.</li><li>Les deux calculent le même secret partagé (jamais transmis).</li><li>Ce secret devient la clé AES de session.</li></ol><div class="pr">✅ <strong>Forward secrecy</strong> : avec DH éphémère (ECDHE), chaque session a sa propre clé. Une clé privée volée ne déchiffre PAS les sessions passées.</div><h3>🔧 Cas 3 — Vérifier un certificat RSA</h3><p><strong>Situation :</strong> examiner la clé d'un site bancaire.</p><pre>openssl s_client -connect banque.ci:443 -showcerts</pre><p>Vérifier : <code>Server public key is 2048 bit</code> (minimum) ou 4096. Si 1024 → alerte.</p>`,
quiz:[
{q:'Combien de clés en asymétrique ?',o:['1','2 (publique et privée)','3','Aucune'],c:1,e:'Une clé publique (à distribuer) et une clé privée (secrète).'},
{q:'RSA est basé sur ?',o:['La factorisation de grands nombres','Le logarithme discret','Les courbes elliptiques','Les hash'],c:0,e:'RSA repose sur la difficulté de factoriser un très grand nombre en ses facteurs premiers.'},
{q:'Diffie-Hellman permet de ?',o:['Chiffrer des fichiers','Échanger une clé sans la transmettre','Signer un document','Hacher un mot de passe'],c:1,e:'DH permet à deux parties de créer un secret partagé sans jamais l envoyer sur le réseau.'}
]},

{
id:4,
titre:"Fonctions de hachage",
intro:"Une fonction de hachage produit une empreinte unique et irréversible. C'est indispensable pour stocker des mots de passe et vérifier l'intégrité.",
cours:`<h3>🎯 Qu'est-ce qu'une fonction de hachage ?</h3><p>Une <strong>fonction de hachage</strong> transforme une donnée de taille quelconque en une empreinte de taille fixe. Cette empreinte est :</p><ul><li><strong>Déterministe</strong> — même entrée = même sortie, toujours.</li><li><strong>Rapide à calculer</strong> — milliers de fois par seconde.</li><li><strong>Irréversible</strong> — impossible de retrouver le message à partir du hash.</li><li><strong>Sensible (effet avalanche)</strong> — 1 bit changé = 50% du hash change.</li><li><strong>Résistante aux collisions</strong> — deux entrées différentes ne doivent pas donner le même hash.</li></ul><h4>📊 Les algorithmes</h4><table><tr><th>Algo</th><th>Taille</th><th>Statut</th></tr><tr><td>MD5</td><td>128 bits</td><td>❌ Cassé (2004)</td></tr><tr><td>SHA-1</td><td>160 bits</td><td>❌ Cassé (2017)</td></tr><tr><td>SHA-256</td><td>256 bits</td><td>✅ Standard</td></tr><tr><td>SHA-3</td><td>variable</td><td>✅ Recommandé</td></tr><tr><td>BLAKE3</td><td>256 bits</td><td>✅ Très rapide</td></tr></table><h4>🔑 Mots de passe — bcrypt, scrypt, Argon2</h4><p>Pour les mots de passe, SHA-256 N'EST PAS suffisant. Pourquoi ? Il est trop rapide → un attaquant teste des milliards de candidats par seconde avec un GPU.</p><p>Il faut des fonctions <strong>lentes par design</strong> :</p><ul><li><strong>bcrypt</strong> — coût paramétrable, très répandu.</li><li><strong>scrypt</strong> — résiste aux attaques par ASIC/GPU.</li><li><strong>Argon2id</strong> — ✅ recommandé 2024 (gagnant du concours PHC).</li></ul><h4>🧂 Le sel (salt)</h4><p>Un <strong>sel</strong> est une valeur aléatoire ajoutée au mot de passe avant le hash. Empêche les <strong>rainbow tables</strong> (tables de hash précalculés).</p><p><code>hash = Argon2id(password + salt)</code>. Le sel est stocké avec le hash (pas secret), mais unique par utilisateur.</p><div class="analogy">🧠 <strong>Analogie</strong> : le hash d'un fichier est comme une empreinte digitale. Vous ne pouvez pas reconstruire la personne à partir de son empreinte, mais deux personnes n'ont pas la même. Pour les mots de passe, ajouter un sel = ajouter un tatouage unique par utilisateur.</div><div class="bank">🏦 <strong>Banque</strong> : les mots de passe des utilisateurs bancaires sont stockés avec Argon2id ou bcrypt + sel unique. Les mots de passe des cartes (PIN) sont chiffrés dans un HSM avec 3DES ou AES.</div><div class="df">⚠️ <strong>Piège</strong> : ne jamais stocker un mot de passe en clair, ni avec un simple SHA-256. Une fuite de base avec SHA-256 non salé = tous les mots de passe cassés en quelques heures.</div>`,
cas:`<h3>🔧 Cas 1 — Hacher un fichier pour vérifier l'intégrité</h3><p><strong>Situation :</strong> après avoir téléchargé une ISO Debian, vérifier qu'elle n'a pas été altérée.</p><pre>sha256sum debian.iso</pre><p>Comparer avec le SHA-256 publié sur le site officiel. Si différent → fichier corrompu ou malveillant.</p><h3>🔧 Cas 2 — Détecter un stockage de mot de passe faible</h3><p><strong>Situation :</strong> audit d'une base utilisateurs.</p><ol><li>Un hash de 32 caractères hexadécimaux = MD5 → à migrer d'urgence.</li><li>Un hash de 40 caractères = SHA-1 → à migrer.</li><li>Un hash de 64 caractères = SHA-256 sans sel → à migrer vers Argon2id.</li><li>Un hash commençant par <code>$2b$</code> = bcrypt ✅ bon.</li><li>Un hash commençant par <code>$argon2id$</code> = Argon2id ✅ excellent.</li></ol><div class="er">❌ Une base avec des mots de passe en clair ou en MD5 doit être considérée comme compromise.</div><h3>🔧 Cas 3 — Rainbow table et sel</h3><p><strong>Situation :</strong> comprendre pourquoi le sel protège.</p><p>Sans sel : <code>hash("password123")</code> donne toujours la même valeur → un attaquant peut télécharger une rainbow table contenant des millions de hash précalculés.</p><p>Avec sel aléatoire par utilisateur : <code>hash("password123" + "xK9#mP")</code> donne une valeur unique. Impossible d'utiliser une rainbow table.</p>`,
quiz:[
{q:'Quel algorithme de hash est recommandé pour les mots de passe ?',o:['MD5','SHA-1','SHA-256 seul','Argon2id'],c:3,e:'Argon2id est conçu pour être lent et résistant aux GPUs.'},
{q:'Le sel sert à ?',o:['Accélérer le hash','Empêcher les rainbow tables','Chiffrer le mot de passe','Remplacer le hash'],c:1,e:'Le sel rend chaque hash unique, empêchant l utilisation de tables précalculées.'},
{q:'SHA-1 et MD5 sont ?',o:['Recommandés','Obsolètes et cassés','Identiques','Quantiques'],c:1,e:'MD5 cassé en 2004, SHA-1 en 2017. À ne plus utiliser.'}
]},

{
id:5,
titre:"Certificats et PKI",
intro:"La PKI (Public Key Infrastructure) permet à un site de prouver son identité. C'est ce qui fait qu'un cadenas HTTPS est fiable.",
cours:`<h3>🏛 Qu'est-ce que la PKI ?</h3><p>La <strong>PKI</strong> est l'ensemble des moyens (techniques, humains, procéduraux) pour gérer des certificats. Elle repose sur des <strong>autorités de certification</strong> (AC) qui signent les certificats des sites.</p><h4>📜 Le certificat X.509</h4><p>Un certificat contient :</p><ul><li>Le <strong>nom du sujet</strong> (ex : banque.ci).</li><li>La <strong>clé publique</strong> du site.</li><li>La <strong>date de validité</strong>.</li><li>L'<strong>émetteur</strong> (l'AC qui a signé).</li><li>La <strong>signature</strong> de l'AC (hash de tout ça, signé avec la clé privée de l'AC).</li></ul><h4>🔗 La chaîne de confiance</h4><p>Votre navigateur fait confiance à une centaine de <strong>Root CA</strong> (autorités racine) installées par défaut. Quand vous visitez un site :</p><ol><li>Le site envoie son certificat + le certificat de l'AC intermédiaire.</li><li>Le navigateur vérifie la signature de l'AC intermédiaire avec la clé publique du Root CA.</li><li>Si la chaîne est valide ET le nom correspond ET le certificat n'est pas expiré → cadenas vert.</li></ol><h4>🏢 Les principales AC</h4><ul><li><strong>Let's Encrypt</strong> — gratuit, automatisé, 90 jours.</li><li><strong>DigiCert, GlobalSign, Sectigo</strong> — payants, pour entreprises.</li><li><strong>Certigna, ChamberSign</strong> — AC françaises.</li></ul><h4>❌ Révocation</h4><ul><li><strong>CRL</strong> (Certificate Revocation List) — liste noire téléchargée périodiquement.</li><li><strong>OCSP</strong> (Online Certificate Status Protocol) — vérification en temps réel.</li><li><strong>OCSP Stapling</strong> — le serveur envoie lui-même la preuve de non-révocation.</li></ul><div class="analogy">🧠 <strong>Analogie</strong> : le certificat est une carte d'identité pour un site web. L'AC est le maire qui délivre la carte et garantit son authenticité. Le navigateur vérifie que la carte vient bien d'un maire officiel.</div><div class="bank">🏦 <strong>Banque</strong> : les sites bancaires ont des certificats OV (Organization Validated) ou EV (Extended Validation), pas de simples DV. Ils prouvent l'identité de la banque, pas juste le nom de domaine.</div><div class="df">⚠️ <strong>Piège</strong> : un certificat expiré casse le site (avertissement navigateur). Utiliser une surveillance de l'expiration (30, 14, 7 jours avant).</div>`,
cas:`<h3>🔧 Cas 1 — Inspecter un certificat</h3><p><strong>Situation :</strong> vérifier le certificat de banque.ci.</p><pre>openssl s_client -connect banque.ci:443 -showcerts</pre><p>Ou via le navigateur : cliquer sur le cadenas → Détails du certificat.</p><h4>Vérifications essentielles</h4><ul><li>Émetteur de confiance (Root CA).</li><li>Nom correspond (CN ou SAN).</li><li>Date de validité.</li><li>Algorithme de signature (SHA-256, pas SHA-1).</li><li>Clé publique (RSA 2048+, ECC 256+).</li></ul><h3>🔧 Cas 2 — Détecter un faux certificat</h3><p><strong>Situation :</strong> un attaquant installe un certificat auto-signé pour un site bancaire.</p><h4>Réaction du navigateur</h4><p>Le navigateur affiche un écran rouge « Votre connexion n'est pas privée ». La chaîne ne remonte pas à une Root CA de confiance.</p><div class="er">❌ Ne JAMAIS cliquer sur « Continuer quand même » sur un site bancaire. C'est le signe d'une attaque MITM.</div><h3>🔧 Cas 3 — Certificat Let's Encrypt</h3><p><strong>Situation :</strong> installer un certificat gratuit sur un site.</p><pre>sudo apt install certbot\nsudo certbot --nginx -d monsite.ci</pre><p>Renouvellement automatique tous les 90 jours via cron.</p>`,
quiz:[
{q:'Que contient un certificat X.509 ?',o:['La clé privée','Le nom, la clé publique, la validité, la signature AC','Le mot de passe','Le hash du site'],c:1,e:'Un certificat contient le sujet, sa clé publique, la validité et la signature de l AC.'},
{q:'Let\'s Encrypt délivre des certificats ?',o:['Payants','Gratuits valides 90 jours','Valides 10 ans','Uniquement aux banques'],c:1,e:'Let s Encrypt est gratuit, automatisé, valide 90 jours.'},

{
id:6,
titre:"TLS et HTTPS en détail",
intro:"TLS est le protocole qui sécurise toutes les connexions web. Comprendre son fonctionnement permet de diagnostiquer et de sécuriser n'importe quel service.",
cours:`<h3>🔒 SSL, TLS, HTTPS — les définitions</h3><ul><li><strong>SSL</strong> (1994) — obsolète, ne plus utiliser.</li><li><strong>TLS</strong> (1999-) — successeur de SSL, standard actuel.</li><li><strong>HTTPS</strong> — HTTP + TLS. Le S signifie « Secure ».</li></ul><h4>📊 Les versions TLS</h4><table><tr><th>Version</th><th>Statut</th></tr><tr><td>SSL 3.0</td><td>❌ Cassé (POODLE 2014)</td></tr><tr><td>TLS 1.0</td><td>❌ Obsolète (RFC 8996)</td></tr><tr><td>TLS 1.1</td><td>❌ Obsolète (RFC 8996)</td></tr><tr><td>TLS 1.2</td><td>✅ Acceptable</td></tr><tr><td>TLS 1.3</td><td>✅✅ Recommandé (2018)</td></tr></table><h4>🤝 Le handshake TLS 1.3</h4><p>Le handshake est la phase où client et serveur se mettent d'accord sur la version, les algorithmes et la clé de session.</p><ol><li><strong>ClientHello</strong> — le client annonce TLS 1.3, ses suites, sa part de DH éphémère.</li><li><strong>ServerHello</strong> — le serveur répond avec sa part de DH, son certificat, sa signature.</li><li>Les deux calculent la clé de session (via ECDHE).</li><li>Les données chiffrées peuvent circuler.</li></ol><p>En TLS 1.3, le handshake est <strong>1-RTT</strong> (au lieu de 2 en TLS 1.2) → connexion plus rapide.</p><h4>🔐 Forward secrecy</h4><p>TLS 1.3 impose l'usage de <strong>ECDHE</strong> (éphémère). Chaque session a sa propre clé de session. Si la clé privée du serveur est volée plus tard, elle NE peut PAS déchiffrer les sessions passées.</p><h4>🧪 Les suites cryptographiques</h4><p>Une suite est un ensemble d'algorithmes. Exemple TLS 1.3 :</p><p><code>TLS_AES_256_GCM_SHA384</code> = AES-256-GCM pour le chiffrement, SHA-384 pour le HMAC.</p><div class="analogy">🧠 <strong>Analogie</strong> : le handshake TLS est comme une poignée de main entre deux agents secrets. Ils vérifient mutuellement leurs identités (certificats), échangent une clé secrète de session (sans qu'un espion puisse la voir), puis communiquent chiffré.</div><div class="bank">🏦 <strong>Banque</strong> : tous les sites bancaires doivent utiliser TLS 1.2 minimum, idéalement 1.3. Les connexions API bancaires utilisent mTLS (authentification mutuelle : client ET serveur présentent un certificat).</div><div class="df">⚠️ <strong>Piège</strong> : beaucoup de serveurs gardent TLS 1.0 activé « au cas où ». C'est une faille. Désactiver TLS 1.0/1.1 et SSL 3.0.</div>`,
cas:`<h3>🔧 Cas 1 — Tester la configuration TLS d'un serveur</h3><p><strong>Situation :</strong> vérifier les versions TLS supportées par un site.</p><pre>nmap --script ssl-enum-ciphers -p 443 banque.ci</pre><p>Ou en ligne : ssllabs.com/ssltest.</p><h4>Résultats attendus</h4><ul><li>TLS 1.3 : ✅</li><li>TLS 1.2 : ✅</li><li>TLS 1.0/1.1 : ❌ doit être désactivé</li><li>SSL 3.0 : ❌ doit être désactivé</li><li>Note globale : A ou A+.</li></ul><h3>🔧 Cas 2 — Configurer Nginx en TLS 1.3</h3><p><strong>Situation :</strong> durcir un serveur Nginx.</p><pre>ssl_protocols TLSv1.2 TLSv1.3;\nssl_ciphers TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;\nssl_prefer_server_ciphers on;\nadd_header Strict-Transport-Security "max-age=31536000" always;</pre><h4>Effet</h4><p>TLS 1.0/1.1 refusés, seules les meilleures suites acceptées, HSTS activé.</p><h3>🔧 Cas 3 — Attaque Downgrade</h3><p><strong>Situation :</strong> un attaquant force un client à utiliser TLS 1.0 (cassé) en interceptant le ClientHello.</p><h4>Protection</h4><ul><li>Désactiver TLS 1.0/1.1 côté serveur.</li><li>Configurer HSTS (force HTTPS).</li><li>Utiliser HPKP (obsolète, remplacé par Certificate Transparency).</li></ul>`,
quiz:[
{q:'Quelle version TLS est recommandée en 2024 ?',o:['SSL 3.0','TLS 1.0','TLS 1.1','TLS 1.3'],c:3,e:'TLS 1.3 est le standard, plus rapide et plus sûr.'},
{q:'Le forward secrecy garantit ?',o:['La vitesse','Les sessions passées restent sûres même si la clé privée fuite','Le chiffrement des fichiers','L anonymat'],c:1,e:'Avec ECDHE éphémère, chaque session a sa propre clé.'},
{q:'HTTPS est ?',o:['Un protocole','HTTP + TLS','Un chiffrement','Un hash'],c:1,e:'HTTPS = HTTP sur TLS. Le S signifie Secure.'}
]},

{
id:7,
titre:"Signatures numériques",
intro:"La signature numérique prouve l'auteur ET l'intégrité d'un message. C'est l'équivalent électronique d'une signature manuscrite, mais en beaucoup plus sûr.",
cours:`<h3>✍️ Principe</h3><p>Signer un document, c'est :</p><ol><li>Calculer son hash (ex : SHA-256).</li><li>Chiffrer ce hash avec la clé <strong>privée</strong> du signataire.</li><li>Joindre cette signature au document.</li></ol><p>Vérifier, c'est :</p><ol><li>Recalculer le hash du document.</li><li>Déchiffrer la signature avec la clé <strong>publique</strong> du signataire.</li><li>Comparer les deux hash. Si identiques → signature valide.</li></ol><h4>🎯 Les 3 garanties</h4><ul><li><strong>Authenticité</strong> — seul le détenteur de la clé privée a pu signer.</li><li><strong>Intégrité</strong> — toute modification invalide la signature.</li><li><strong>Non-répudiation</strong> — le signataire ne peut pas nier avoir signé.</li></ul><h4>📊 Les algorithmes</h4><table><tr><th>Algo</th><th>Base</th><th>Usage</th></tr><tr><td>RSA-PSS</td><td>Factorisation</td><td>Signatures générales</td></tr><tr><td>ECDSA</td><td>Courbes elliptiques</td><td>TLS, crypto-monnaies</td></tr><tr><td>Ed25519</td><td>Courbe d'Edwards</td><td>SSH, signatures rapides</td></tr><tr><td>DSA</td><td>Logarithme discret</td><td>Obsolète</td></tr></table><h4>🎯 Usages concrets</h4><ul><li><strong>Code signing</strong> — drivers Windows, applications mobiles signés.</li><li><strong>Emails S/MIME et PGP</strong> — emails signés, non répudiables.</li><li><strong>Documents légaux</strong> — contrats électroniques (eIDAS en Europe).</li><li><strong>Blockchain</strong> — chaque transaction est signée.</li><li><strong>Logiciels</strong> — mises à jour signées (Debian, Windows Update).</li></ul><div class="analogy">🧠 <strong>Analogie</strong> : la signature est un sceau royal. Seul le roi possède le sceau. Tout le monde peut vérifier son authenticité, mais personne ne peut le reproduire.</div><div class="bank">🏦 <strong>Banque</strong> : les virements SWIFT, les contrats bancaires en ligne, les APIs de paiement utilisent des signatures numériques. Les certificats clients mTLS sont en fait des signatures à chaque requête.</div><div class="df">⚠️ <strong>Piège</strong> : ne jamais confondre chiffrement et signature. Chiffrer protège la confidentialité ; signer protège l'intégrité et l'authenticité. Un message peut être signé sans être chiffré (et inversement).</div>`,
cas:`<h3>🔧 Cas 1 — Signer un fichier avec GPG</h3><p><strong>Situation :</strong> signer un document sensible pour prouver son origine.</p><pre>gpg --gen-key  # générer une paire\ngpg --sign document.pdf  # crée document.pdf.gpg\ngpg --verify document.pdf.gpg  # vérifier</pre><h3>🔧 Cas 2 — Vérifier une signature de code</h3><p><strong>Situation :</strong> Windows demande une signature pour installer un driver.</p><ol><li>Le binaire <code>.sys</code> est signé par Microsoft.</li><li>Le noyau Windows vérifie la signature à chaque démarrage.</li><li>Si la signature est invalide ou le certificat révoqué → driver refusé.</li></ol><p>Vérifier manuellement : <code>signtool verify /pa driver.sys</code></p><h3>🔧 Cas 3 — Signer un JWT</h3><p><strong>Situation :</strong> une API bancaire utilise des tokens JWT signés.</p><pre>Header.Payload.Signature</pre><p>Le serveur vérifie la signature avec sa clé publique. Si valide et non expiré → accès autorisé.</p><div class="er">❌ Un JWT avec <code>alg: none</code> ou signature HS256 avec clé faible = faille critique.</div>`,
quiz:[
{q:'Une signature numérique garantit ?',o:['La confidentialité','L authenticité et l intégrité','La vitesse','Le chiffrement'],c:1,e:'Authenticité et intégrité. Pas de confidentialité (sauf si le message est aussi chiffré).'},
{q:'Pour signer, on utilise ?',o:['La clé publique','La clé privée','Le hash seul','Un mot de passe'],c:1,e:'On signe avec la clé privée, on vérifie avec la clé publique.'},
{q:'Ed25519 est basé sur ?',o:['La factorisation','Les courbes elliptiques','SHA-256','AES'],c:1,e:'Ed25519 est une signature à courbe d Edwards, très rapide et sûre.'}
]},

{
id:8,
titre:"Gestion des clés",
intro:"Les clés sont le cœur de la cryptographie. Mal gérées, toute la sécurité s'effondre. Leur cycle de vie doit être rigoureux.",
cours:`<h3>🔑 Le cycle de vie d'une clé</h3><ol><li><strong>Génération</strong> — aléatoire cryptographique (pas <code>Math.random</code> !), taille suffisante.</li><li><strong>Distribution</strong> — sécurisée (jamais par email).</li><li><strong>Stockage</strong> — chiffré, hors ligne si possible.</li><li><strong>Usage</strong> — limité à l'usage prévu (une clé = un usage).</li><li><strong>Rotation</strong> — remplacement périodique (90j à 1 an selon usage).</li><li><strong>Destruction</strong> — effacement sécurisé (zéroisation).</li></ol><h4>🏛 Les HSM (Hardware Security Modules)</h4><p>Un <strong>HSM</strong> est un boîtier physique qui génère et stocke des clés sans jamais les exporter en clair. C'est le standard bancaire (norme FIPS 140-2 niveau 3 ou 4).</p><ul><li>Utilisé pour : clés de CA, clés bancaires, certificats.</li><li>Exemples : Thales Luna, Utimaco, AWS CloudHSM.</li><li>Coût : 10 000 à 100 000+ EUR.</li></ul><h4>☁️ Les KMS (Key Management Service)</h4><p>Un <strong>KMS</strong> est un service cloud de gestion de clés. Alternative aux HSM coûteux.</p><ul><li>AWS KMS, Azure Key Vault, GCP Cloud KMS, HashiCorp Vault.</li><li>Facturé à l'usage.</li></ul><h4>🚫 Les erreurs à éviter</h4><ul><li>Clé dans le code source ou un fichier .env commité.</li><li>Clé en clair dans une variable d'environnement sur un serveur compromis.</li><li>Même clé pour tous les environnements (dev = prod).</li><li>Jamais de rotation.</li><li>Pas de séparation des rôles (le développeur a la clé de prod).</li></ul><div class="analogy">🧠 <strong>Analogie</strong> : les clés sont comme les clés physiques d'une banque. Vous ne les laissez pas sur la porte, vous les rangez dans un coffre (HSM), vous les changez régulièrement (rotation), et seul le chef d'agence y a accès (séparation des rôles).</div><div class="bank">🏦 <strong>Banque</strong> : les HSM bancaires contiennent les clés des PIN de carte, des terminaux de paiement, des connexions SWIFT. Une compromission d'un HSM met en danger TOUTE la banque. FIPS 140-2 niveau 3 minimum exigé.</div><div class="df">⚠️ <strong>Piège</strong> : le code source d'une application est souvent public sur GitHub. Une clé API AWS commitée en clair peut être exploitée en 30 secondes par des bots qui scannent GitHub. Des factures AWS de 100 000 USD en quelques heures ont été causées par ça.</div>`,
cas:`<h3>🔧 Cas 1 — Clé API en clair sur GitHub</h3><p><strong>Situation :</strong> un développeur commite accidentellement une clé AWS dans un repo public.</p><h4>Réaction immédiate (dans les 5 minutes)</h4><ol><li>Révoquer la clé dans AWS IAM immédiatement.</li><li>Auditer les logs CloudTrail (activité de la clé).</li><li>Vérifier la facturation (minage crypto).</li><li>Créer une nouvelle clé avec des permissions minimales.</li><li>Utiliser <code>git filter-branch</code> ou BFG pour effacer l'historique.</li><li>Ajouter un hook pre-commit (git-secrets).</li></ol><div class="er">❌ Ne JAMAIS laisser une clé exposée, même quelques minutes.</div><h3>🔧 Cas 2 — Rotation de clé sans interruption</h3><p><strong>Situation :</strong> faire tourner une clé TLS sans casser le service.</p><ol><li>Générer la nouvelle clé et le nouveau certificat.</li><li>Configurer le serveur avec les DEUX certificats (ancien + nouveau).</li><li>Attendre 24h (propagation DNS, caches).</li><li>Retirer l'ancien certificat.</li><li>Documenter la rotation.</li></ol><h3>🔧 Cas 3 — Stocker un secret avec Vault</h3><p><strong>Situation :</strong> un serveur bancaire doit accéder à un mot de passe de base de données.</p><ol><li>Installer HashiCorp Vault.</li><li>Stocker le mot de passe dans Vault.</li><li>Le serveur s'authentifie auprès de Vault avec un token court.</li><li>Vault retourne le mot de passe (ou une version dynamique).</li><li>Le mot de passe n'est JAMAIS dans le code source.</li></ol>`,
quiz:[
{q:'Un HSM sert à ?',o:['Hacher','Stocker des clés de manière inviolable','Chiffrer des fichiers','Signer des emails'],c:1,e:'Le HSM est un boîtier physique qui stocke les clés sans les exporter.'},
{q:'La rotation des clés doit être ?',o:['Jamais','Périodique','Une fois','Chaque seconde'],c:1,e:'Rotation régulière (90j à 1 an) pour limiter l impact en cas de fuite.'},
{q:'Une clé API commitée sur GitHub doit être ?',o:['Ignorée','Révoquée immédiatement','Conservée','Partagée'],c:1,e:'Révoquer immédiatement : des bots scannent GitHub en permanence.'}
]},

{
id:9,
titre:"Cryptographie et banque",
intro:"Le secteur bancaire est le plus gros utilisateur de cryptographie au monde. PCI-DSS, EMV, 3-D Secure reposent dessus.",
cours:`<h3>🏦 Les réglementations</h3><h4>PCI-DSS</h4><p><strong>PCI-DSS</strong> (Payment Card Industry Data Security Standard) est le standard de sécurité des cartes bancaires. Exigences cryptographiques :</p><ul><li>Chiffrement des numéros de carte (PAN) en transit ET au repos.</li><li>Chiffrement des données d'authentification (PIN, CVV).</li><li>TLS 1.2+ obligatoire pour les connexions.</li><li>Gestion des clés documentée (rotation, séparation des rôles).</li><li>HSM pour les PIN blocks.</li></ul><h4>EMV — puces bancaires</h4><p>Le standard <strong>EMV</strong> (Europay-Mastercard-Visa) définit les cartes à puce. Chaque transaction est signée cryptographiquement par la puce :</p><ul><li>Impossible de cloner (contrairement à la bande magnétique).</li><li>Chaque transaction a un cryptogramme unique.</li><li>Signature RSA ou ECC avec clé dans la puce.</li></ul><h4>3-D Secure 2.0</h4><p>Le « 3-D Secure » (Verified by Visa, Mastercard SecureCode) ajoute une authentification supplémentaire pour les paiements en ligne. Version 2.0 :</p><ul><li>Analyse comportementale (pas de mot de passe à chaque fois).</li><li>Authentification forte si risque élevé (biométrie, code).</li><li>Communications chiffrées entre marchand, banque, réseau.</li></ul><h4>💳 Le PIN block</h4><p>Le code PIN d'une carte est chiffré dans un format spécial (<strong>PIN block</strong>, ISO 9564) avant d'être envoyé au HSM. Algorithmes : 3DES ou AES. Le PIN en clair ne quitte JAMAIS le HSM.</p><h4>🔐 Autres usages bancaires</h4><ul><li><strong>SWIFT</strong> — messages chiffrés entre banques.</li><li><strong>SEPA</strong> — virements européens signés.</li><li><strong>Mobiles bancaires</strong> — clés dans le Secure Enclave / TEE du téléphone.</li><li><strong>Tokens</strong> — un jeton remplace le numéro de carte (Apple Pay, Google Pay).</li></ul><div class="analogy">🧠 <strong>Analogie</strong> : la cryptographie bancaire est comme la chaîne de sécurité d'un fourgon blindé. À chaque étape (client, terminal, processeur, banque), une serrure différente protège le contenu. Même si une serrure est cassée, les autres tiennent.</div><div class="bank">🏦 <strong>Banque CI</strong> : la BCEAO impose aux banques ivoiriennes le chiffrement des données de carte, l'usage de HSM certifiés, et une politique de gestion des clés documentée. Un audit annuel est obligatoire.</div><div class="df">⚠️ <strong>Piège</strong> : ne jamais stocker le CVV/CVC après autorisation (interdit PCI-DSS). Un site e-commerce qui stocke le CVV est en violation et risque de lourdes amendes.</div>`,
cas:`<h3>🔧 Cas 1 — Vérifier la conformité PCI-DSS</h3><p><strong>Situation :</strong> audit d'une application de paiement.</p><h4>Checklist cryptographique</h4><ul><li>Numéros de carte chiffrés en base (AES-256).</li><li>TLS 1.2+ minimum, 1.3 recommandé.</li><li>CVV non stocké après autorisation.</li><li>Clés dans un HSM certifié FIPS 140-2 niveau 3.</li><li>Rotation des clés documentée (au moins annuelle).</li><li>Logs d'accès aux clés conservés 1 an.</li></ul><h3>🔧 Cas 2 — Transaction EMV</h3><p><strong>Situation :</strong> comprendre ce qui se passe quand vous payez par carte à puce.</p><ol><li>La puce et le terminal échangent des messages.</li><li>La puce génère un cryptogramme (ARQC) avec sa clé privée.</li><li>Le terminal envoie le cryptogramme à la banque.</li><li>La banque vérifie la signature avec la clé publique de la carte.</li><li>Si valide → transaction autorisée.</li></ol><h3>🔧 Cas 3 — Fuite de PAN</h3><p><strong>Situation :</strong> une base de données contient des numéros de carte en clair.</p><div class="er">❌ Violation PCI-DSS majeure. Sanctions possibles :</div><ul><li>Amendes de 5 000 à 100 000 USD par mois.</li><li>Suspension du droit d'accepter les cartes.</li><li>Notification obligatoire aux clients.</li><li>Audit forcé à la charge de l'entreprise.</li></ul><p>Correction : chiffrer immédiatement, révoquer les cartes exposées, notifier la banque.</p>`,
quiz:[
{q:'PCI-DSS impose ?',o:['Chiffrement des données de carte','Rien','Le cloud','Un antivirus'],c:0,e:'PCI-DSS exige le chiffrement des PAN et données sensibles.'},
{q:'EMV sécurise grâce à ?',o:['La bande magnétique','La puce qui signe chaque transaction','Un mot de passe','Un code PIN seul'],c:1,e:'La puce EMV signe cryptographiquement chaque transaction.'},
{q:'Stocker le CVV après paiement ?',o:['Recommandé','Interdit PCI-DSS','Obligatoire','Utile'],c:1,e:'Interdit PCI-DSS : le CVV ne doit jamais être stocké.'}
]},

{
id:10,
titre:"Attaques cryptographiques",
intro:"Connaître les attaques permet de mieux se défendre. Cette dernière étape est la plus importante pour un futur analyste sécurité.",
cours:`<h3>🎯 Attaques sur les algorithmes</h3><ul><li><strong>Force brute</strong> — tester toutes les clés. Faisable sur DES (56 bits) ou mot de passe faible. Impossible sur AES-256.</li><li><strong>Cryptanalyse</strong> — exploiter une faiblesse mathématique. Ex : MD5 cassé par collisions (2004).</li><li><strong>Rainbow tables</strong> — tables de hash précalculées. Contrées par le sel.</li></ul><h3>🕵️ Attaques sur les protocoles</h3><ul><li><strong>MITM</strong> (Man-in-the-Middle) — l'attaquant s'insère entre client et serveur. Empêché par TLS bien configuré.</li><li><strong>Downgrade</strong> — forcer TLS 1.0 (cassé). Empêché en désactivant les vieilles versions.</li><li><strong>Replay</strong> — rejouer une transaction capturée. Empêché par nonce/timestamp.</li><li><strong>POODLE</strong> (2014) — attaque sur SSL 3.0, casse le padding. SSL obsolète = protégé.</li><li><strong>Heartbleed</strong> (2014) — faille OpenSSL qui permettait de lire la mémoire du serveur. Corrigée depuis.</li></ul><h3>🔧 Attaques sur les implémentations</h3><ul><li><strong>Padding oracle</strong> — exploiter les messages d'erreur de déchiffrement pour deviner le clair. Contré par des modes AEAD (GCM).</li><li><strong>Bleichenbacher</strong> — attaque sur RSA avec padding PKCS#1 v1.5. Contrée par OAEP.</li><li><strong>Side-channel</strong> — mesurer le temps, la consommation électrique, les émissions pour deviner la clé. Contré par constant-time.</li></ul><h3>⚛️ La menace quantique</h3><ul><li><strong>Algorithme de Shor</strong> — un ordinateur quantique pourrait casser RSA et ECC en quelques heures.</li><li><strong>Algorithme de Grover</strong> — divise par 2 la sécurité d'AES (AES-256 → 128 bits effectifs, toujours sûr).</li><li><strong>Post-quantique</strong> — nouveaux algorithmes : Kyber (échange de clés), Dilithium (signatures). NIST a standardisé en 2024.</li></ul><div class="analogy">🧠 <strong>Analogie</strong> : les attaques cryptographiques sont comme les techniques de cambriolage. Chaque serrure a ses vulnérabilités : crochetage (force brute), exploitation d'une faiblesse (cryptanalyse), écoute (MITM), copie de clé (replay). La défense consiste à connaître ces techniques.</div><div class="bank">🏦 <strong>Banque</strong> : les SOC bancaires surveillent en permanence les tentatives d'attaque : scans SSL/TLS, tentatives de downgrade, certificats auto-signés anormaux. Une alerte sur « certificat expiré » peut être une vraie attaque MITM.</div><div class="df">⚠️ <strong>Piège</strong> : croire qu'« on est trop petit pour être attaqué ». Les attaques automatisées scannent TOUT Internet en permanence.</div>`,
cas:`<h3>🔧 Cas 1 — Détecter un MITM</h3><p><strong>Situation :</strong> un utilisateur se connecte à un Wi-Fi public et accède à son espace bancaire.</p><h4>Signes d'alerte</h4><ul><li>Certificat « auto-signé » (avertissement navigateur).</li><li>Nom du certificat différent du domaine attendu.</li><li>Page qui semble différente (design légèrement altéré).</li><li>Demande de mot de passe inhabituelle.</li></ul><h4>Protection</h4><ul><li>HSTS sur le site bancaire.</li><li>VPN sur Wi-Fi public.</li><li>Ne jamais ignorer un avertissement de certificat.</li></ul><h3>🔧 Cas 2 — POODLE</h3><p><strong>Situation :</strong> un vieux serveur force SSL 3.0.</p><h4>Attaque</h4><p>L'attaquant MITM force le downgrade vers SSL 3.0, puis exploite la faiblesse du padding CBC pour déchiffrer progressivement les cookies de session.</p><h4>Protection</h4><ul><li>Désactiver SSL 3.0 (côté serveur).</li><li>Navigateurs modernes le font par défaut.</li><li>Utiliser TLS 1.3 avec AES-GCM.</li></ul><h3>🔧 Cas 3 — Préparer le post-quantique</h3><p><strong>Situation :</strong> une banque anticipe la menace quantique (horizon 2030-2040).</p><h4>Plan</h4><ol><li>Inventorier toutes les clés cryptographiques (RSA, ECC).</li><li>Prioriser les données sensibles à longue durée de vie (données clients, archives).</li><li>Tester les algorithmes post-quantiques (Kyber, Dilithium).</li><li>Déployer en hybride (RSA + Kyber) pendant la transition.</li><li>Prévoir le remplacement complet d'ici 2035.</li></ol>`,

function validerQuiz(id) {
  var d = null;
  for (var i = 0; i < DEFIS.length; i++) { if (DEFIS[i].id === id) { d = DEFIS[i]; break; } }
  if (!d) return;
  var correct = 0;
  for (var qi = 0; qi < d.quiz.length; qi++) {
    var q = d.quiz[qi];
    var sel = document.querySelector('input[name="q' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var e = document.getElementById('exp' + qi); if (e) e.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var u = user();
  u.quizScores = u.quizScores || {};
  u.quizScores['4_' + id] = { correct: correct, total: d.quiz.length };
  if (correct === d.quiz.length) {
    var k = '4_' + id;
    if (!u.defisDone[k]) {
      u.defisDone[k] = true;
      var t = today();
      if (!u.jours[t]) u.jours[t] = { defis: [] };
      if (u.jours[t].defis.indexOf(k) === -1) u.jours[t].defis.push(k);
    }
  }
  save();
  var r = document.getElementById('qr');
  var pass = correct === d.quiz.length;
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 ' + correct + '/' + d.quiz.length + ' — Défi validé !' : correct + '/' + d.quiz.length + ' — Réessaie';
  if (pass && id === 10 && isComplete(4)) {
    setTimeout(function(){ alert('🏆 FÉLICITATIONS !\n\nTu as terminé les 10 défis du Niveau 4 !\nTon certificat Cryptographie est disponible.'); }, 400);
  }
}

  html += '<div class="skill"><div class="name"><span>PKI &amp; TLS</span><span>' + Math.min(d4*10,100) + '%</span></div><div class="bar"><div style="width:' + Math.min(d4*10,100) + '%"></div></div></div>';
  html += '<div class="skill"><div class="name"><span>Gestion des clés (HSM)</span><span>' + Math.min(d4*10,100) + '%</span></div><div class="bar"><div style="width:' + Math.min(d4*10,100) + '%"></div></div></div>';
  html += '</div></div>';
  html += '<div class="cv-section"><h2>Défis N4 validés</h2><ul style="font-size:.85rem;color:#334155;line-height:1.7;padding-left:20px;margin:0">' + defis4 + '</ul></div>';

  html += '<div class="cv-section"><h2>Évaluations</h2>';
  html += '<div class="cv-item"><div class="line1"><span class="title">Partiel N4</span><span class="date">' + (u.examens['4_partiel'] ? 'Réussi le ' + u.examens['4_partiel'] : 'Non passé') + '</span></div></div>';
  html += '<div class="cv-item"><div class="line1"><span class="title">Final N4</span><span class="date">' + (u.examens['4_final'] ? 'Réussi le ' + u.examens['4_final'] : 'Non passé') + '</span></div></div>';
  html += '</div>';
  html += '<div class="cv-footer">Généré le ' + new Date().toLocaleDateString('fr-FR') + ' · Mon Drôle Parcours Cyber — H. N\'GUESSAN ®</div>';
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}

function copyCV() {
  var u = user(); if (!u) return;
  var d1 = countDone(1), d2 = countDone(2), d3 = countDone(3), d4 = countDone(4);
  var t = u.name.toUpperCase() + '\nÉtudiant L2 UVCI — Aspirant Analyste Cybersécurité / Crypto\n\nFORMATIONS\n- L2 UVCI Sciences informatiques\n- Mon Drôle Parcours Cyber N1 (' + d1 + '/10)\n- Mon Drôle Parcours Cyber N2 (' + d2 + '/10)\n- Mon Drôle Parcours Cyber N3 (' + d3 + '/10)\n- Mon Drôle Parcours Cyber N4 (' + d4 + '/10)\n\nCOMPETENCES\n- Fondamentaux, Réseaux, Linux/Windows\n- Cryptographie : AES, RSA, ECC, hash, PKI, TLS, signatures, HSM, crypto bancaire\n\nGénéré le ' + new Date().toLocaleDateString('fr-FR');
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){ alert('CV copié !'); }, function(){ fbCopy(t); }); } else fbCopy(t);
}
function fbCopy(t) { var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); alert('CV copié !'); } catch (e) { alert('Copie manuelle'); } document.body.removeChild(ta); }

function renderStats() {
  var u = user(); if (!u) return;
  var t = today();
  var td = (u.jours && u.jours[t]) ? u.jours[t] : { defis: [] };
  var d1 = countDone(1), d2 = countDone(2), d3 = countDone(3), d4 = countDone(4);
  var html = '<div class="crumb"><a onclick="go(\'home\')">Accueil N4</a> / Stats</div>';
  html += '<div class="card"><h2>📊 ' + u.name + '</h2><div class="stats-grid">';
  html += '<div class="stat"><span class="big">' + d1 + '</span><span class="lbl">N1</span></div>';
  html += '<div class="stat"><span class="big">' + d2 + '</span><span class="lbl">N2</span></div>';
  html += '<div class="stat"><span class="big">' + d3 + '</span><span class="lbl">N3</span></div>';
  html += '<div class="stat"><span class="big">' + d4 + '</span><span class="lbl">N4</span></div>';
  html += '</div></div>';
  html += '<div class="card"><h3>🔥 Aujourd\'hui (' + t + ')</h3>';
  if (td.defis.length === 0) html += '<p style="color:#94a3b8">Aucun défi aujourd\'hui.</p>';
  else {
    html += '<ul class="today-list">';
    for (var i = 0; i < td.defis.length; i++) {
      var did = td.defis[i];
      var num = parseInt(did.split('_')[1]);
      var lvl = did.split('_')[0];
      var titre = 'Défi ' + num;
      if (lvl === '4') { for (var j = 0; j < DEFIS.length; j++) { if (DEFIS[j].id === num) { titre = DEFIS[j].titre; break; } } }
      html += '<li>✅ Niveau ' + lvl + ' · ' + titre + '</li>';
    }
    html += '</ul>';
  }
  html += '<div class="nav"><button onclick="go(\'\')">Continuer</button></div></div>';
  html += '<div class="card"><h3>📅 Historique (14 jours)</h3>';
  var jours = u.jours || {};
  var keys = Object.keys(jours).sort().reverse().slice(0, 14);
  if (keys.length === 0) html += '<p style="color:#94a3b8">Pas d\'historique.</p>';
  else {
    for (var ki = 0; ki < keys.length; ki++) {
      var k = keys[ki];
      html += '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e2a44;font-size:.87em"><span>' + k + '</span><span style="color:#22c55e"><b>' + (jours[k].defis ? jours[k].defis.length : 0) + '</b> défi(s)</span></div>';
    }
  }
  html += '</div>';
  document.getElementById('app').innerHTML = html;
}

function renderJobs() {
  var html = '<div class="crumb"><a onclick="go(\'home\')">Accueil N4</a> / Emploi</div>';
  html += '<div class="card"><h2>💼 Offres cyber — Côte d\'Ivoire</h2><div class="jobs-grid">';

    var j = JOBS[i];
    html += '<div class="job-item"><h4>' + j.t + '</h4><div class="job-org">' + j.o + ' · ' + j.l + '</div><div class="job-desc">' + j.d + '</div><a class="job-link" href="' + j.u + '" target="_blank" rel="noopener">Voir ↗</a></div>';
  }

  html += '<div class="card"><h3>🔍 Sites</h3><ul><li><a href="https://www.novojob.com/" target="_blank">Novojob</a></li><li><a href="https://www.emploi.ci/" target="_blank">Emploi.ci</a></li><li><a href="https://ci.eclozion-opportunities.com/" target="_blank">Eclozion</a></li><li><a href="https://emploi.ci.cari.africa/" target="_blank">Cari Emploi</a></li><li><a href="https://www.linkedin.com/jobs/" target="_blank">LinkedIn Jobs</a></li></ul></div>';
  document.getElementById('app').innerHTML = html;
}

function renderCerts() {
  var u = user();
  var d4 = countDone(4);
  var html = '<div class="crumb"><a onclick="go(\'home\')">Accueil N4</a> / Certifications</div>';
  html += '<div class="card"><h2>🎓 Certifications</h2><div class="tabs">';
  html += '<div class="tab active" onclick="filterCerts(this,\'all\')">Toutes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'free\')">💚 Gratuites</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'paid\')">💛 Payantes</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'unlocked\')">🔓 Débloquées</div>';
  html += '<div class="tab" onclick="filterCerts(this,\'done\')">✅ Obtenues</div>';
  html += '</div><div class="certs-grid">';
  for (var i = 0; i < CERTS.length; i++) {
    var c = CERTS[i];
    var isD = u.certsDone.indexOf(c.id) !== -1;
    var unlocked = d4 >= c.req;
    html += '<div class="cert-item ' + (c.free ? 'free' : 'paid') + ' ' + (isD ? 'done' : '') + '" data-t="' + (c.free ? 'free' : 'paid') + '" data-d="' + (isD ? '1' : '0') + '" data-u="' + (unlocked ? '1' : '0') + '">';
    html += '<h4>' + c.nom + '</h4><div class="org">' + c.org + '</div>';
    html += '<div><span class="tag ' + (c.free ? 'free' : 'paid') + '">' + (c.free ? 'GRATUIT' : c.prix) + '</span><span class="tag lvl">' + c.niv + '</span><span class="tag req">Défi N4 ' + c.req + '+</span></div>';
    html += '<p>' + c.desc + '</p><div class="actions"><a href="' + c.lien + '" target="_blank" rel="noopener">Voir ↗</a><button onclick="toggleCert(\'' + c.id + '\')">' + (isD ? '✓ Obtenue' : 'Marquer') + '</button></div></div>';
  }
  html += '</div></div>';
  document.getElementById('app').innerHTML = html;
}
function filterCerts(el, type) {
  var tabs = document.querySelectorAll('.tab');
  for (var i = 0; i < tabs.length; i++) tabs[i].classList.remove('active');
  el.classList.add('active');
  var items = document.querySelectorAll('.cert-item');
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var m = false;
    if (type === 'all') m = true;
    else if (type === 'done') m = it.dataset.d === '1';
    else if (type === 'unlocked') m = it.dataset.u === '1';
    else m = it.dataset.t === type;
    it.style.display = m ? 'flex' : 'none';
  }
}
function toggleCert(id) {
  var u = user(); if (!u) return;
  var i = u.certsDone.indexOf(id);
  if (i === -1) u.certsDone.push(id); else u.certsDone.splice(i, 1);
  save(); renderCerts();
}

function renderExamens() {
  var u = user(); if (!u) return;
  var html = '<div class="crumb"><a onclick="go(\'home\')">Accueil N4</a> / Examens</div>';
  html += '<div class="card"><h2>📝 Examens Niveau 4</h2><p style="color:#94a3b8;font-size:.9em">Partiel : défis 1-5 (60 %). Final : défis 1-10 (80 %).</p></div>';
  var types = ['partiel','final'];
  for (var i = 0; i < types.length; i++) {
    var type = types[i];
    var e = EXAMENS[type];
    var passed = u.examens['4_' + type];
    var ready = true;
    for (var j = 0; j < e.req.length; j++) { if (!u.defisDone['4_' + e.req[j]]) { ready = false; break; } }
    var cls = 'exam-card ' + (passed ? 'passed' : ready ? '' : 'locked');
    html += '<div class="' + cls + '"><h4>' + e.titre + '</h4><p style="font-size:.85em;color:#cbd5e1">' + e.desc + '</p>';
    if (passed) html += '<p style="color:#86efac;font-size:.85em">✅ Réussi le ' + passed + '</p><button class="green" onclick="go(\'examen/' + type + '\')">Refaire</button>';
    else if (ready) html += '<button class="gold" onclick="go(\'examen/' + type + '\')">Passer</button>';
    else html += '<p style="color:#fbbf24;font-size:.82em">🔒 Termine d\'abord : défis ' + e.req.join(', ') + '</p>';
    html += '</div>';
  }
  document.getElementById('app').innerHTML = html;
}

function renderExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) { go('examens'); return; }
  var ready = true;
  for (var j = 0; j < e.req.length; j++) { if (!u.defisDone['4_' + e.req[j]]) { ready = false; break; } }
  if (!ready) { alert('Valide d abord les defis N4 requis.'); go('examens'); return; }
  var html = '<div class="crumb"><a onclick="go(\'examens\')">Examens</a> / ' + e.titre + '</div>';
  html += '<div class="card"><h2>' + e.titre + '</h2><p style="color:#94a3b8;font-size:.85em">' + e.desc + '</p><div class="quiz">';
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    html += '<div class="q" data-i="' + qi + '"><p>Q' + (qi + 1) + '. ' + q.q + '</p>';
    for (var oi = 0; oi < q.o.length; oi++) {
      html += '<label><input type="radio" name="ex' + qi + '" value="' + oi + '"> ' + q.o[oi] + '</label>';
    }
    html += '<div class="exp" id="exexp' + qi + '">' + q.e + '</div></div>';
  }
  html += '<button onclick="validerExamen(\'' + type + '\')">Soumettre</button><div id="er"></div></div></div>';
  document.getElementById('app').innerHTML = html;
}

function validerExamen(type) {
  var u = user(); if (!u) return;
  var e = EXAMENS[type]; if (!e) return;
  var correct = 0;
  for (var qi = 0; qi < e.qs.length; qi++) {
    var q = e.qs[qi];
    var sel = document.querySelector('input[name="ex' + qi + '"]:checked');
    var labels = document.querySelectorAll('.q[data-i="' + qi + '"] label');
    for (var li = 0; li < labels.length; li++) { labels[li].classList.remove('ok','ko'); }
    var ex = document.getElementById('exexp' + qi); if (ex) ex.style.display = 'block';
    if (sel && parseInt(sel.value) === q.c) { correct++; labels[q.c].classList.add('ok'); }
    else { labels[q.c].classList.add('ok'); if (sel) labels[parseInt(sel.value)].classList.add('ko'); }
  }
  var pct = Math.round(correct / e.qs.length * 100);
  var req = type === 'final' ? 80 : 60;
  var pass = pct >= req;
  if (pass) { u.examens['4_' + type] = new Date().toISOString().slice(0,10); save(); }
  var r = document.getElementById('er');
  r.className = 'res ' + (pass ? 'g' : 'r');
  r.textContent = pass ? '🎉 Réussi ! ' + correct + '/' + e.qs.length + ' (' + pct + '%)' : correct + '/' + e.qs.length + ' (' + pct + '%) — Il faut ' + req + ' %';
}

function b64(s) { try { return btoa(unescape(encodeURIComponent(s))); } catch (e) { return ''; } }
function unb64(b) { try { return decodeURIComponent(escape(atob(b.replace(/\s/g, '')))); } catch (e) { return null; } }
function exportCode() { return b64(JSON.stringify(state)); }
function importCode(c) { var j = unb64(c.trim()); if (!j) return false; try { var d = JSON.parse(j); if (!d || typeof d !== 'object') return false; state = Object.assign({}, state, d); save(); return true; } catch (e) { return false; } }
function dlBackup() { var b = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }); var u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = 'mdpc-n4-' + today() + '.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u); }
function readFile(input) { var f = input.files[0]; if (!f) return; var r = new FileReader(); r.onload = function(e) { try { var d = JSON.parse(e.target.result); state = Object.assign({}, state, d); save(); alert('Restauré !'); route(); } catch (err) { alert('Fichier invalide'); } }; r.readAsText(f); }

function renderSync() {
  var u = user();
  var code = exportCode();
  var html = '<div class="crumb"><a onclick="go(\'home\')">Accueil N4</a> / Sync</div>';
  html += '<div class="card"><h2>🌐 Synchronisation</h2></div>';
  html += '<div class="card"><h3>📋 Code</h3><div class="sync-box"><label>Ton code</label><textarea id="so" readonly onclick="this.select()">' + code + '</textarea><div class="sync-actions"><button onclick="copyCode()">📋 Copier</button></div></div>';
  html += '<div class="sync-box"><label>Coller un code</label><textarea id="si" placeholder="Colle ici..."></textarea><div class="sync-actions"><button class="green" onclick="applyCode()">🔄 Restaurer</button></div></div></div>';
  html += '<div class="card"><h3>💾 Fichier</h3><div class="sync-actions"><button onclick="dlBackup()">⬇️ Télécharger</button><input type="file" id="bf" accept=".json" style="display:none" onchange="readFile(this)"><button class="sec" onclick="document.getElementById(\'bf\').click()">⬆️ Importer</button></div></div>';
  document.getElementById('app').innerHTML = html;
}
function copyCode() { var ta = document.getElementById('so'); ta.select(); try { document.execCommand('copy'); alert('Copié !'); } catch (e) { alert('Manuel : Ctrl+C'); } }
function applyCode() { var c = document.getElementById('si').value; if (!c.trim()) { alert('Colle un code.'); return; } if (importCode(c)) { alert('Restauré !'); route(); } else alert('Code invalide.'); }

function route() {
  try {
    updateHeader();
    if (!state.currentUser) { renderLogin(); return; }
    if (!isUnlocked(4)) { renderLocked(); return; }
    var h = (location.hash || '#home').slice(1);
    var p = h.split('/');
    if (p[0] === 'home' || p[0] === '') return renderHome();
    if (p[0] === 'defi' && p[1]) return renderDefi(parseInt(p[1]));
    if (p[0] === 'certif') return renderCertif();
    if (p[0] === 'cv') return renderCV();
    if (p[0] === 'stats') return renderStats();
    if (p[0] === 'jobs') return renderJobs();
    if (p[0] === 'examens') return renderExamens();
    if (p[0] === 'examen' && p[1]) return renderExamen(p[1]);
    if (p[0] === 'certs') return renderCerts();
    if (p[0] === 'sync') return renderSync();
    if (p[0] === 'login') return renderLogin();
    renderHome();
  } catch (e) {
    console.error('ROUTE ERROR', e);
    document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur</h2><p style="color:#ef4444">' + e.message + '</p><pre style="color:#fca5a5;font-size:.8em;white-space:pre-wrap">' + (e.stack || '') + '</pre></div>';
  }
}

window.addEventListener('hashchange', route);

try { route(); }
catch (e) { document.getElementById('app').innerHTML = '<div class="card"><h2 style="color:#ef4444">Erreur init</h2><p style="color:#ef4444">' + e.message + '</p></div>'; }
</script>
